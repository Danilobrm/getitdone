services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: getitdone
    ports:
      - "5434:5432"
    volumes:
      - getitdone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d getitdone"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  getitdone_pgdata:
